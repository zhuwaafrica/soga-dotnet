version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      entityframeworkcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
